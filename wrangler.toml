# Cloudflare Pages Deployment Configuration for Four Landscapes
# Free unlimited bandwidth, zero commercial portfolio tier restrictions
# Supports Custom Domains with Universal SSL (HTTPS) and Global Edge Caching

name = "four-landscapes"
compatibility_date = "2026-01-01"
pages_build_output_dir = "out"

[build]
command = "npm run build"
watch_dir = ["app", "components", "content", "public"]

[vars]
ENVIRONMENT = "production"
ANALYTICS_DOMAIN = "fourlandscapes.climate"
